# Format: interface allow|deny source-CIDR
# No active policy: enabling anti_spoof requires a nonempty policy.
# Replace these commented examples with YOUR attached interfaces/subnets.
# lan0 allow 192.168.1.0/24
# lan0 allow fd00:1::/64
# wan0 allow 0.0.0.0/0
# wan0 deny 192.168.1.0/24
# wan0 allow ::/0
# wan0 deny fd00:1::/64
# Longest prefix wins. Unmatched IPv4 AND IPv6 sources on a selected interface
# are denied. Explicitly allow needed IPv6 link-local/ND and DHCP sources.
