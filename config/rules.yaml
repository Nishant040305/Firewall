# ==========================================================
#         Firewall Policy Rules (Step 8)
# ==========================================================
# Rules are evaluated sequentially. First match applies.
# Put specific DROP rules above the final catch-all ALLOW rule.
# No traffic is blocked by policy unless an active DROP rule matches.
# Packet validation and connection-state checks still apply; established
# tracked connections can bypass rule evaluation until their state expires.
# The catch-all is required: the kernel drops traffic if no rule matches,
# regardless of default_policy in firewall.yaml.

# Example block rule (inactive until uncommented):
# - name: "Block TCP port 23"
#   proto: tcp
#   dport: 23
#   action: drop
#   desc: "Block Telnet"

# Keep this rule last. No address or port restriction: IPv4 and IPv6,
# ingress and egress, and all IP protocols match.
- name: "Allow all other traffic"
  proto: any
  family: any
  action: allow
  desc: "Default allow"
